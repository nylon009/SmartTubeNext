name: Sync Upstream and Build Release

on:
  #schedule:
  #  - cron: '0 0 * * 1'   # 每周一 UTC 0 点
  workflow_dispatch:       # 也支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master with submodules
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream and check for updates
        id: check
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "上游无新提交"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      #- name: Exit if no upstream update
      #  if: steps.check.outputs.updated == 'false'
      #  run: exit 0

      - name: Rebase master onto upstream (exit on conflict)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rebase upstream/master; then
            echo "::error::master 变基到上游 master 时冲突，已中止流程。请手动解决冲突。"
            git rebase --abort
            exit 1
          fi
          git push origin master --force-with-lease

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set build version
        run: |
          DATE_DOT=$(date +%Y.%m.%d)
          DATE_UNDERSCORE=$(date +%Y_%m_%d)
          YY=$(date +%y)
          MM=$(date +%m)
          DD=$(date +%d)

          # 自动编号：查询当天已存在的 tag，序号递增
          EXISTING=$(git ls-remote --tags origin "v${DATE_DOT}.*" | awk -F/ '{print $NF}' | sed "s|^v${DATE_DOT}\.||" | sort -n | tail -1)
          if [ -z "$EXISTING" ]; then
            SEQ=1
          else
            SEQ=$((EXISTING + 1))
          fi
          SEQ2=$(printf "%02d" "$SEQ")

          # versionCode: yymmdd{seq}（8 位数字，seq 为两位补零）
          VERSION_CODE="${YY}${MM}${DD}${SEQ2}"
          # versionName: yy.mm.dd{seq}
          VERSION_NAME="${YY}.${MM}.${DD}${SEQ2}"
          TAG="v${DATE_DOT}.${SEQ}"

          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" smarttubetv/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" smarttubetv/build.gradle

          echo "DATE_UNDERSCORE=${DATE_UNDERSCORE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Configure Build Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/release.jks" >> keystore.properties

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStstableRelease --stacktrace

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG }}"

          mkdir -p release-assets
          find . -path '*/build/outputs/apk/*/*.apk' -type f | while read -r apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "release-assets/${base}.apk"
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::未找到 APK 产物，请检查构建变体名和产物路径。"
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --repo nylon009/SmartTubeNext \
            --title "Build $TAG" \
            --notes "Auto-built from master after upstream sync on $(date +%Y-%m-%d)" \
            release-assets/*.apk
