name: Sync Upstream and Build Release

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 0 点
  workflow_dispatch:       # 也支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master with submodules
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Rebase master onto upstream (exit on conflict)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch upstream master
          if ! git rebase upstream/master; then
            echo "::error::master 变基到上游 master 时冲突，已中止流程。请手动解决冲突。"
            git rebase --abort
            exit 1
          fi
          git push origin master --force-with-lease

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStstableRelease \
            -PRELEASE_STORE_FILE=$RUNNER_TEMP/release.jks \
            -PRELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Rename APK with date and create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_DOT=$(date +%Y.%m.%d)
          DATE_UNDERSCORE=$(date +%Y_%m_%d)

          # 自动编号：查询本仓当天已存在的 tag，序号递增
          EXISTING=$(git ls-remote --tags origin "v${DATE_DOT}.*" | awk -F/ '{print $NF}' | sed "s|^v${DATE_DOT}\.||" | sort -n | tail -1)
          if [ -z "$EXISTING" ]; then
            SEQ=1
          else
            SEQ=$((EXISTING + 1))
          fi
          TAG="v${DATE_DOT}.${SEQ}"

          mkdir -p release-assets
          find . -path '*/build/outputs/apk/*/*.apk' -type f | while read -r apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "release-assets/${base}_${DATE_UNDERSCORE}.apk"
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::未找到 APK 产物，请检查构建变体名和产物路径。"
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --repo nylon009/SmartTubeNext \
            --title "Build $TAG" \
            --notes "Auto-built from master after upstream sync on $(date +%Y-%m-%d)" \
            release-assets/*.apk