name: Sync Upstream and Build Release

on:
  #schedule:
  #  - cron: '0 0 * * 1'   # 每周一 UTC 0 点
  workflow_dispatch:       # 也支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master with submodules
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream and check for updates
        id: check
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "上游无新提交，退出流程。"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Exit if no upstream update
        if: steps.check.outputs.updated == 'false'
        run: exit 0

      - name: Rebase master onto upstream (exit on conflict)
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rebase upstream/master; then
            echo "::error::master 变基到上游 master 时冲突，已中止流程。请手动解决冲突。"
            git rebase --abort
            exit 1
          fi
          git push origin master --force-with-lease

      - name: Set up JDK 11
        if: steps.check.outputs.updated == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build Release APK
        if: steps.check.outputs.updated == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStstableRelease --stacktrace

      - name: Rename APK with date and create Release
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_DOT=$(date +%Y.%m.%d)
          DATE_UNDERSCORE=$(date +%Y_%m_%d)

          # 自动编号：查询当天已存在的 tag，序号递增
          EXISTING=$(git ls-remote --tags origin "v${DATE_DOT}.*" | awk -F/ '{print $NF}' | sed "s|^v${DATE_DOT}\.||" | sort -n | tail -1)
          if [ -z "$EXISTING" ]; then
            SEQ=1
          else
            SEQ=$((EXISTING + 1))
          fi
          TAG="v${DATE_DOT}.${SEQ}"

          mkdir -p release-assets
          find . -path '*/build/outputs/apk/*/*.apk' -type f | while read -r apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "release-assets/${base}_${DATE_UNDERSCORE}.apk"
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::未找到 APK 产物，请检查构建变体名和产物路径。"
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Build $TAG" \
            --notes "Auto-built from master after upstream sync on $(date +%Y-%m-%d)" \
            release-assets/*.apk